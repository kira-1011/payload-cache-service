[project]
name = "payload-cache-service"
version = "0.1.0"
description = "FastAPI microservice that caches transformer results in PostgreSQL, with a CLI client"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "fastapi-cli>=0.0.32",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.47",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The service and the CLI ship as two top-level modules of one distribution;
# a uv workspace would be heavier than this small project needs.
module-name = ["cache_service", "cache_cli"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
