[project]
name = "payload-cache-service"
version = "0.1.0"
description = "FastAPI microservice that caches transformer results in PostgreSQL, with a CLI client"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "fastapi-cli>=0.0.32",
    "httpx2>=2.13.1",
    "limits>=5.8.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.47",
]

[project.scripts]
cache-cli = "cache_cli.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The service and the CLI ship as two top-level modules of one distribution;
# a uv workspace would be heavier than this small project needs.
module-name = ["cache_service", "cache_cli"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.ruff.lint]
# Ruff's defaults (pyflakes + basic pycodestyle) plus three rule sets the formatter doesn't cover.
extend-select = [
    "I",   # import sorting
    "B",   # flake8-bugbear: common bug patterns (mutable defaults, etc.)
    "UP",  # pyupgrade: modern syntax for the target Python version
]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    # Raised inside slowapi 0.1.10, which calls an asyncio function deprecated in Python 3.14.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi",
]

[tool.fastapi]
entrypoint = "cache_service.main:app"
