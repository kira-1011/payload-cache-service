name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the running checks obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Keep in sync with the uv version pinned in the Dockerfile.
          version: "0.12.23"
          enable-cache: true

      # --locked fails the job if uv.lock is out of date with pyproject.toml.
      # Python comes from .python-version.
      - name: Install the project
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true

      # ty resolves imports against the installed dependencies, so the project must be synced.
      - name: Install the project
        run: uv sync --locked

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: ty type check
        run: uv run ty check
